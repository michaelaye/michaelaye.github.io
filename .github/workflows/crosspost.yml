name: Crosspost new blog posts

# Announces newly ADDED posts/<slug>/index.{qmd,md} on Bluesky and Mastodon.
# Editing an existing post never re-announces it. Repository secrets needed:
#   BLUESKY_HANDLE, BLUESKY_APP_PASSWORD, MASTODON_INSTANCE, MASTODON_ACCESS_TOKEN

on:
  push:
    branches: [main]
    paths:
      - 'posts/**/index.qmd'
      - 'posts/**/index.md'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug to announce, e.g. 2026-08-13_planet-four-uncertainty-api'
        required: true
      dry_run:
        description: 'Print the posts instead of sending them'
        type: boolean
        default: true

concurrency:
  group: crosspost
  cancel-in-progress: false

jobs:
  crosspost:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff the pushed range

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Announce new posts
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          POST_SLUG: ${{ github.event.inputs.slug }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: python scripts/crosspost.py
